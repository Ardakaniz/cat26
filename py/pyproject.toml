[project]
name = "cat26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "adrien.renaudineau@universite-paris-saclay.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "jax>=0.11.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[project.scripts]
run = "cat26:run"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
